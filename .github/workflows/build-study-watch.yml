name: Build Study Watch (Windows)

on:
  push:
    paths:
      - "study-watch/**"
      - ".github/workflows/build-study-watch.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: study-watch
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Build StudyWatch.exe
        run: pyinstaller --onefile --noconsole --name StudyWatch --collect-all bleak --collect-all winrt.runtime --collect-all winrt.system --collect-all winrt.windows.devices.bluetooth --collect-all winrt.windows.devices.bluetooth.advertisement --collect-all winrt.windows.devices.bluetooth.genericattributeprofile --collect-all winrt.windows.devices.enumeration --collect-all winrt.windows.foundation --collect-all winrt.windows.foundation.collections --collect-all winrt.windows.storage.streams --collect-all winrt.windows.media.ocr --collect-all winrt.windows.graphics.imaging study_watch.py

      - name: Check the text helpers and imports
        run: |
          python test_text.py
          python -c 'import windows_capture, mss, pystray, keyboard; print("imports ok")'

      - name: Check the Bluetooth modules are inside StudyWatch.exe
        shell: bash
        run: |
          pyi-archive_viewer --list --recursive dist/StudyWatch.exe > contents.txt
          for m in winrt.windows.devices.bluetooth winrt.windows.devices.bluetooth.advertisement winrt.windows.devices.bluetooth.genericattributeprofile winrt.windows.devices.enumeration winrt.windows.foundation winrt.windows.foundation.collections winrt.windows.storage.streams winrt.windows.media.ocr winrt.windows.graphics.imaging; do
            grep -qi "$m" contents.txt || { echo "MISSING from the exe: $m"; exit 1; }
          done
          echo "all Bluetooth modules bundled"

      - uses: actions/upload-artifact@v4
        with:
          name: StudyWatch-exe
          path: study-watch/dist/StudyWatch.exe

      - name: Publish to the "study-watch-latest" release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: study-watch-latest
          name: Study Watch (latest Windows build)
          target_commitish: ${{ github.sha }}
          body: "Download StudyWatch.exe below and run it on your Windows laptop. Built from ${{ github.sha }}."
          files: study-watch/dist/StudyWatch.exe
          make_latest: false
